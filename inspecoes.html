<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspeções | INSPEFROTA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://rvtquhqeivrhcdoreghu.supabase.co/storage/v1/object/public/cipa-branding/icone-app.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <img src="https://rvtquhqeivrhcdoreghu.supabase.co/storage/v1/object/public/cipa-branding/logo-inspefrota.png" alt="INSPEFROTA" class="loading-logo" onerror="this.style.display='none';">
  <p style="font-weight:600; font-size:14px;">Carregando inspeções...</p>
</div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <img src="https://rvtquhqeivrhcdoreghu.supabase.co/storage/v1/object/public/cipa-branding/logo-inspefrota.png" alt="INSPEFROTA" class="brand-logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'color:#ffc93c; font-size:24px; font-weight:800; letter-spacing:-1px; text-align:center;\'>INSPEFROTA</div>';">
  </div>
  <div class="nav-label">Painel</div>
  <nav>
    <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
    <a href="veiculos.html"><span class="icon">🚗</span> Veículos</a>
  </nav>
  <div class="nav-label">Inspeções</div>
  <nav>
    <a class="active"><span class="icon">🔍</span> Ver Inspeções</a>
    <a href="checklists.html"><span class="icon">📋</span> Checklists</a>
  </nav>
  <div class="sidebar-footer">
    <div class="avatar-sm" id="userAvatar">?</div>
    <div class="info">
      <strong id="userName">—</strong>
      <small>Gestor de Frota</small>
    </div>
    <button class="btn-logout" onclick="fazerLogout()" title="Sair">🚪</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <h2>Histórico de Inspeções
      <span>Veja todas as inspeções realizadas na frota</span>
    </h2>
    <div class="topbar-actions">
      <button class="btn btn-secondary" onclick="carregarInspecoes()">🔄 Atualizar</button>
      <button class="btn btn-gold" onclick="exportarCSV()">📊 Exportar CSV</button>
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="card" style="padding: 18px 22px; margin-bottom: 20px;">
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <input type="text" class="form-control" id="busca" placeholder="🔍 Buscar por placa, inspetor ou checklist..." style="flex: 1; min-width: 240px;" oninput="renderizar()">
      <select class="form-control" id="filtroResultado" style="max-width: 200px;" onchange="renderizar()">
        <option value="">Todos os resultados</option>
        <option value="ok">✅ Alta conformidade (≥90%)</option>
        <option value="parcial">⚠️ Média (70-89%)</option>
        <option value="nok">❌ Baixa (&lt;70%)</option>
      </select>
    </div>
  </div>

  <!-- TABELA -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Veículo</th>
          <th>Checklist</th>
          <th>Inspetor</th>
          <th>Resultado</th>
          <th style="text-align:right;">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaInspecoes"></tbody>
    </table>
  </div>
</main>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="modalDetalhes">
  <div class="modal" style="max-width: 720px;">
    <div class="modal-header">
      <h3>🔍 Detalhes da Inspeção</h3>
      <button class="close-btn" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
      <button class="btn btn-gold" onclick="exportarPDFIndividual()">📄 Baixar PDF</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://rvtquhqeivrhcdoreghu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_kNF6eX_67yzNGWIyjwZvOw_0__qWSMW';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let inspecoes = [];
  let listaFiltrada = [];
  let inspecaoSelecionada = null;

  let toastTimer;
  function mostrarToast(msg, tipo = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + tipo;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  async function verificarLogin() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return false; }
    const nome = session.user.email.split('@')[0];
    document.getElementById('userName').textContent = nome.charAt(0).toUpperCase() + nome.slice(1);
    document.getElementById('userAvatar').textContent = nome.substring(0, 2).toUpperCase();
    return true;
  }

  async function fazerLogout() {
    if (!confirm('Deseja sair?')) return;
    await db.auth.signOut();
    window.location.href = 'index.html';
  }

  function formatarData(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  async function carregarInspecoes() {
    const { data, error } = await db.from('veiculos_inspecoes').select('*').order('created_at', { ascending: false });
    if (error) { mostrarToast('❌ ' + error.message, 'error'); return; }
    inspecoes = data || [];
    renderizar();
    setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 400);
  }

  function renderizar() {
    const busca = (document.getElementById('busca').value || '').toLowerCase().trim();
    const filtroRes = document.getElementById('filtroResultado').value;

    let lista = [...inspecoes];
    if (busca) {
      lista = lista.filter(i =>
        (i.veiculo_placa || '').toLowerCase().includes(busca) ||
        (i.veiculo_modelo || '').toLowerCase().includes(busca) ||
        (i.inspetor_nome || '').toLowerCase().includes(busca) ||
        (i.checklist_titulo || '').toLowerCase().includes(busca)
      );
    }
    if (filtroRes) {
      lista = lista.filter(i => {
        const pct = parseFloat(i.percentual_conformidade) || 0;
        if (filtroRes === 'ok') return pct >= 90;
        if (filtroRes === 'parcial') return pct >= 70 && pct < 90;
        if (filtroRes === 'nok') return pct < 70;
        return true;
      });
    }

    listaFiltrada = lista;
    const tbody = document.getElementById('tabelaInspecoes');
    tbody.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-soft);">Nenhuma inspeção encontrada.</td></tr>';
      return;
    }

    lista.forEach(i => {
      const pct = parseFloat(i.percentual_conformidade) || 0;
      const cls = pct >= 90 ? 'ok' : pct >= 70 ? 'parcial' : 'nok';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${formatarData(i.created_at)}</strong></td>
        <td><strong>${i.veiculo_placa}</strong><br><small style="color:var(--text-soft);">${i.veiculo_modelo}</small></td>
        <td>${i.checklist_titulo}</td>
        <td>${i.inspetor_nome}</td>
        <td><span class="badge ${cls}">${pct.toFixed(0)}%</span></td>
        <td>
          <div style="display:flex; gap:6px; justify-content:flex-end;">
            <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="abrirDetalhes('${i.id}')">👁️ Ver</button>
            <button class="btn btn-gold" style="padding: 6px 12px; font-size: 12px;" onclick="baixarPDFPorId('${i.id}')">📄 PDF</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function abrirDetalhes(id) {
    const i = inspecoes.find(x => String(x.id) === String(id));
    if (!i) return;
    inspecaoSelecionada = i;

    const respostas = i.respostas || [];
    let respostasHtml = '';
    respostas.forEach((r, idx) => {
      const ok = r.resposta === 'conforme';
      respostasHtml += `
        <div style="display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start;">
          <div style="width:28px; height:28px; border-radius:50%; background:${ok ? 'var(--success)' : 'var(--danger)'}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0;">${ok ? '✓' : '✗'}</div>
          <div style="flex:1;">
            <strong style="font-size:13.5px; display:block; margin-bottom:4px;">${idx + 1}. ${r.pergunta}</strong>
            <small style="color:${ok ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">${ok ? '✅ Conforme' : '❌ Não Conforme'}</small>
          </div>
        </div>
      `;
    });

    const pct = parseFloat(i.percentual_conformidade) || 0;
    const cls = pct >= 90 ? 'ok' : pct >= 70 ? 'parcial' : 'nok';

    document.getElementById('modalBody').innerHTML = `
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <strong style="min-width:120px; color:var(--text-soft); font-size:12px; text-transform:uppercase;">Veículo</strong>
        <div><strong>${i.veiculo_placa}</strong> - ${i.veiculo_modelo}</div>
      </div>
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <strong style="min-width:120px; color:var(--text-soft); font-size:12px; text-transform:uppercase;">Checklist</strong>
        <div>${i.checklist_titulo}</div>
      </div>
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <strong style="min-width:120px; color:var(--text-soft); font-size:12px; text-transform:uppercase;">Inspetor</strong>
        <div>${i.inspetor_nome}</div>
      </div>
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <strong style="min-width:120px; color:var(--text-soft); font-size:12px; text-transform:uppercase;">Local</strong>
        <div>${i.local_inspecionado || '—'}</div>
      </div>
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <strong style="min-width:120px; color:var(--text-soft); font-size:12px; text-transform:uppercase;">Data</strong>
        <div>${formatarData(i.created_at)}</div>
      </div>
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
        <strong style="min-width:120px; color:var(--text-soft); font-size:12px; text-transform:uppercase;">Resultado</strong>
        <div>
          <span class="badge ${cls}" style="margin-right:8px;">${pct.toFixed(1)}%</span>
          <span style="color:var(--text-soft); font-size:12.5px;">${i.total_conformes} conformes • ${i.total_nao_conformes} não conformes • ${i.total_itens} itens</span>
        </div>
      </div>
      <h4 style="margin-top:20px; margin-bottom:12px; font-size:15px; font-weight:800;">📝 Respostas (${respostas.length})</h4>
      ${respostasHtml}
    `;

    document.getElementById('modalDetalhes').classList.add('open');
  }

  function fecharModal() {
    document.getElementById('modalDetalhes').classList.remove('open');
    inspecaoSelecionada = null;
  }

  function baixarPDFPorId(id) {
    const i = inspecoes.find(x => String(x.id) === String(id));
    if (i) { inspecaoSelecionada = i; exportarPDFIndividual(); }
  }

  function exportarPDFIndividual() {
    if (!inspecaoSelecionada) { mostrarToast('⚠️ Nenhuma inspeção selecionada', 'error'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const i = inspecaoSelecionada;

    doc.setFillColor(10, 31, 19);
    doc.rect(0, 0, 210, 25, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.text('RELATÓRIO DE INSPEÇÃO VEICULAR - INSPEFROTA', 105, 15, { align: 'center' });

    let y = 35;
    doc.setTextColor(11, 18, 32);
    doc.setFontSize(10);
    doc.text(`Veículo: ${i.veiculo_placa} - ${i.veiculo_modelo}`, 15, y); y += 6;
    doc.text(`Checklist: ${i.checklist_titulo}`, 15, y); y += 6;
    doc.text(`Inspetor: ${i.inspetor_nome}`, 15, y); y += 6;
    doc.text(`Local: ${i.local_inspecionado || '—'}`, 15, y); y += 6;
    doc.text(`Data: ${formatarData(i.created_at)}`, 15, y); y += 10;

    const pct = parseFloat(i.percentual_conformidade) || 0;
    doc.setFillColor(240, 244, 248);
    doc.rect(15, y - 4, 180, 10, 'F');
    doc.setFontSize(9);
    doc.text(`Conformidade: ${pct.toFixed(1)}% | ${i.total_conformes} conformes | ${i.total_nao_conformes} não conformes`, 15, y + 2);
    y += 14;

    (i.respostas || []).forEach((r, idx) => {
      if (y > 270) { doc.addPage(); y = 20; }
      const ok = r.resposta === 'conforme';
      doc.setFillColor(ok ? 209 : 254, ok ? 250 : 226, ok ? 229 : 226);
      doc.rect(15, y - 4, 180, 8, 'F');
      doc.setTextColor(11, 18, 32);
      doc.setFontSize(9);
      doc.text(`${idx + 1}. ${r.pergunta}`, 17, y + 1);
      doc.setTextColor(ok ? 4 : 153, ok ? 120 : 27, ok ? 87 : 27);
      doc.setFont('helvetica', 'bold');
      doc.text(ok ? 'OK' : 'NC', 190, y + 1, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      y += 10;
    });

    doc.save(`inspecao-${i.veiculo_placa}-${Date.now()}.pdf`);
    mostrarToast('📄 PDF gerado!');
  }

  function exportarCSV() {
    if (listaFiltrada.length === 0) { mostrarToast('⚠️ Nada para exportar', 'error'); return; }
    const header = ['Data', 'Veículo', 'Modelo', 'Checklist', 'Inspetor', 'Local', 'Conformes', 'Não Conformes', 'Conformidade %'];
    const rows = listaFiltrada.map(i => [
      formatarData(i.created_at),
      i.veiculo_placa || '',
      i.veiculo_modelo || '',
      i.checklist_titulo || '',
      i.inspetor_nome || '',
      i.local_inspecionado || '',
      i.total_conformes || 0,
      i.total_nao_conformes || 0,
      i.percentual_conformidade || 0
    ]);
    const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `inspecoes-inspefrota-${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    mostrarToast('📊 CSV exportado!');
  }

  document.getElementById('modalDetalhes').addEventListener('click', e => {
    if (e.target.id === 'modalDetalhes') fecharModal();
  });

  (async () => {
    if (await verificarLogin()) await carregarInspecoes();
  })();
</script>
</body>
</html>
